name: YMB CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Transactions Dependencies
        run: |
          cd transactions-service
          npm install

      - name: Run Transactions Test Suite
        run: |
          cd transactions-service
          npm test