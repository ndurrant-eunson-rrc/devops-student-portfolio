version: '3.8'

services:
  mongo:
    image: mongo:4.4
    container_name: mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - prf-network

  bankingapp:
    build: ./banking-app
    container_name: bankingapp
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017/bank_app
    depends_on:
      - mongo
    networks:
      - prf-network

  transactions:
    build: ./transactions-service
    container_name: transactions
    restart: always
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/bank_app
    depends_on:
      - mongo
    networks:
      - prf-network

  frontend:
    build: ./student-portfolio
    container_name: studentportfolio
    restart: always
    networks:
      - prf-network

  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    restart: always
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - bankingapp
      - transactions
    networks:
      - prf-network

volumes:
  mongo_data:

networks:
  prf-network:
    driver: bridge